<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>EcoFiscal P01 v3</title>
<style>
@font-face{font-family:Poppins;font-weight:400;src:url(fonts/poppins-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:500;src:url(fonts/poppins-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:700;src:url(fonts/poppins-latin-700-normal.woff2) format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Poppins,sans-serif;-webkit-font-smoothing:antialiased}
.art{width:1080px;height:1350px;position:relative;overflow:hidden}
.logo{position:absolute;left:390px;bottom:58px;width:300px;z-index:5}

/* =========== CAPA | azul vibrante + objeto protagonista (ref. relógio) =========== */
#capa{background:
  radial-gradient(900px 900px at 75% 40%,#1A63E6 0%,#1259D8 45%,#0C45B8 100%)}
#capa .hex{position:absolute;inset:0;opacity:.10}
#capa .objeto{position:absolute;left:300px;top:286px;width:800px;height:1000px;
  background:url(ativos/capa_P01_azul.png) center/cover no-repeat;
  -webkit-mask-image:radial-gradient(58% 52% at 64% 54%,#000 55%,transparent 100%);
          mask-image:radial-gradient(58% 52% at 64% 54%,#000 55%,transparent 100%)}
#capa .base{position:absolute;left:0;right:0;bottom:0;height:300px;
  background:linear-gradient(180deg,rgba(8,29,61,0) 0%,rgba(8,29,61,.85) 62%,#081D3D 100%)}
#capa .texto{position:absolute;left:80px;top:250px;width:560px;z-index:3}
#capa h1{font-size:90px;line-height:1.12;font-weight:500;color:#fff;letter-spacing:-1px}
#capa h1 .d{font-weight:700;color:#27C9D5}
#capa h1 b{font-weight:700}
#capa .fio{display:block;width:120px;height:6px;border-radius:3px;margin:44px 0 40px;
  background:linear-gradient(90deg,#27C9D5,#5FA8FF)}
#capa p{font-size:54px;line-height:1.28;font-weight:400;color:#fff}
#capa p .d{font-weight:600;color:#27C9D5}

/* =========== CARD 02 | branco editorial (ref. carrossel claro / rotina) =========== */
#c02{background:#F3F6FA}
#c02 .grade{position:absolute;inset:0}
#c02 .halo{position:absolute;right:-180px;top:220px;width:620px;height:620px;border-radius:50%;
  background:radial-gradient(circle,rgba(39,201,213,.28) 0%,rgba(39,201,213,0) 68%)}
#c02 .marcador{position:absolute;left:80px;top:230px;display:flex;gap:10px}
#c02 .marcador i{width:16px;height:16px;border-radius:4px;background:#081D3D}
#c02 .marcador i+i{background:#27C9D5}
#c02 .marcador i+i+i{background:#C9D5E6}
#c02 .painel{position:absolute;left:80px;right:80px;top:320px;
  background:rgba(255,255,255,.92);border:2px solid #E1E8F2;border-radius:44px;
  padding:70px 68px 76px;box-shadow:0 30px 80px rgba(16,58,130,.10)}
#c02 .painel::before{content:"";position:absolute;left:68px;top:0;width:150px;height:8px;border-radius:0 0 6px 6px;background:#007B8C}
#c02 h2{font-size:80px;line-height:1.12;font-weight:500;color:#081D3D;letter-spacing:-.8px}
#c02 h2 .d{font-weight:700;color:#007B8C}
#c02 .linha{height:2px;background:linear-gradient(90deg,#007B8C 0,#007B8C 120px,#E1E8F2 120px);margin:44px 0 40px}
#c02 p{font-size:54px;line-height:1.3;font-weight:400;color:#1E2F4D}
#c02 p .d{font-weight:600;color:#007B8C}
#c02 .base{position:absolute;left:0;right:0;bottom:0;height:250px}
</style>
</head>
<body>

<section class="art" id="capa">
  <svg class="hex" viewBox="0 0 1080 1350" aria-hidden="true">
    <defs><pattern id="hx" width="104" height="180" patternUnits="userSpaceOnUse">
      <path d="M52 0 L104 30 L104 90 L52 120 L0 90 L0 30 Z M52 120 L52 180" fill="none" stroke="#9CC4FF" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="hxm" cx=".15" cy=".1" r=".6"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="mk"><rect width="1080" height="1350" fill="url(#hxm)"/></mask></defs>
    <rect width="1080" height="1350" fill="url(#hx)" mask="url(#mk)"/>
  </svg>
  <div class="objeto"></div>
  <div class="base"></div>
  <div class="texto">
    <h1>Seu cliente do <span class="d">Simples</span> vende para <b>empresas?</b></h1>
    <span class="fio"></span>
    <p>A escolha de <span class="d">2027</span> merece atenção.</p>
  </div>
  <img class="logo" src="ativos/logo_recortada.png" alt="EcoFiscal MT">
</section>

<section class="art" id="c02">
  <svg class="grade" viewBox="0 0 1080 1350" aria-hidden="true">
    <g stroke="#E2E8F1" stroke-width="2">
      <line x1="270" y1="0" x2="270" y2="1350"/><line x1="540" y1="0" x2="540" y2="1350"/><line x1="810" y1="0" x2="810" y2="1350"/>
    </g>
    <path d="M-40 1070 C 220 1000, 420 1100, 640 1040 S 1000 960, 1120 1010" fill="none" stroke="#BFD3EA" stroke-width="2"/>
  </svg>
  <div class="halo"></div>
  <div class="marcador"><i></i><i></i><i></i></div>
  <div class="painel">
    <h2>Revise a <span class="d">opção</span></h2>
    <div class="linha"></div>
    <p>Identifique os clientes que escolheram o <span class="d">regime regular de IBS e&nbsp;CBS</span> para o&nbsp;primeiro semestre de&nbsp;2027.</p>
  </div>
  <svg class="base" viewBox="0 0 1080 250" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 90 C 300 20, 760 150, 1080 60 L1080 250 L0 250 Z" fill="#081D3D"/>
    <path d="M0 90 C 300 20, 760 150, 1080 60" fill="none" stroke="#27C9D5" stroke-width="3" opacity=".8"/>
  </svg>
  <img class="logo" src="ativos/logo_recortada.png" alt="EcoFiscal MT">
</section>

</body>
</html>
