<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>EcoFiscal P01</title>
<style>
@font-face{font-family:Poppins;font-weight:400;src:url(fonts/poppins-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:500;src:url(fonts/poppins-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:700;src:url(fonts/poppins-latin-700-normal.woff2) format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Poppins,sans-serif;-webkit-font-smoothing:antialiased}
.art{width:1080px;height:1350px;position:relative;overflow:hidden}
.logo{position:absolute;left:390px;bottom:52px;width:300px}

/* ===== CAPA | família A | marinho com fotografia integrada ===== */
#capa{background:#000E28}
#capa .foto{position:absolute;left:0;top:-105px;width:1080px;height:1350px;
  background:url(ativos/capa_P01_ia.png) center/cover no-repeat}
/* funde a base da foto ao marinho e reforça a área de leitura */
#capa .fusao{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(0,14,40,0) 0%,rgba(0,14,40,0) 52%,rgba(0,14,40,.72) 68%,#000E28 84%),
  linear-gradient(90deg,rgba(8,29,61,.55) 0%,rgba(8,29,61,0) 45%)}
#capa .texto{position:absolute;left:80px;right:80px;top:800px}
#capa h1{font-size:80px;line-height:1.14;font-weight:500;color:#fff;letter-spacing:-.6px}
#capa h1 .d{font-weight:700;color:#27C9D5}
#capa h1 b{font-weight:700}
#capa p{margin-top:32px;font-size:44px;line-height:1.3;font-weight:400;color:#C9D7EC}
#capa p b{font-weight:700;color:#fff}

/* ===== CARD 02 | branco editorial (R2 cards claros) ===== */
#c02{background:#F3F6FA}
#c02 .formas{position:absolute;inset:0}
#c02 .texto{position:absolute;left:80px;right:80px;top:480px}
#c02 h2{font-size:64px;line-height:1.16;font-weight:700;color:#081D3D;letter-spacing:-.4px}
#c02 h2 .marca{display:inline-block;background:#007B8C;color:#fff;padding:0 18px 4px;border-radius:10px;margin-left:4px}
#c02 .apoio{margin-top:44px;display:flex;gap:36px}
#c02 .fio{flex:0 0 4px;border-radius:2px;background:linear-gradient(180deg,#007B8C,#27C9D5)}
#c02 p{font-size:44px;line-height:1.34;font-weight:400;color:#33435E;text-wrap:pretty}
#c02 p b{font-weight:700;color:#103A82}
</style>
</head>
<body>

<section class="art" id="capa">
  <div class="foto"></div>
  <div class="fusao"></div>
  <div class="texto">
    <h1>Seu cliente do <span class="d">Simples</span><br>vende para <b>empresas?</b></h1>
    <p>A escolha de <b>2027</b> merece atenção.</p>
  </div>
  <img class="logo" src="ativos/logo_recortada.png" alt="EcoFiscal MT">
</section>

<section class="art" id="c02">
  <svg class="formas" viewBox="0 0 1080 1350" aria-hidden="true">
    <defs>
      <linearGradient id="arco" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3EAF4"/>
      </linearGradient>
    </defs>
    <path d="M1080 0 L1080 300 C 900 250, 760 140, 700 0 Z" fill="#E6EDF6"/>
    <path d="M420 1350 C 520 1000, 820 780, 1080 720 L1080 1350 Z" fill="url(#arco)"/>
    <path d="M700 1350 C 760 1110, 920 960, 1080 920 L1080 1350 Z" fill="#DCE5F1"/>
  </svg>
  <div class="texto">
    <h2>Revise a <span class="marca">opção</span></h2>
    <div class="apoio">
      <span class="fio"></span>
      <p>Identifique os clientes que escolheram o <b>regime regular de IBS e&nbsp;CBS</b> para o&nbsp;primeiro semestre de&nbsp;2027.</p>
    </div>
  </div>
  <img class="logo" src="ativos/logo_recortada.png" alt="EcoFiscal MT">
</section>

</body>
</html>
