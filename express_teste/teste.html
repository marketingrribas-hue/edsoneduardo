<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="hz:slide-selector" content=".slide">
<link rel="stylesheet" href="https://use.typekit.net/xon2qvs.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:#0865EE;font-family:"montserrat",sans-serif}
.t{position:absolute;left:90px;top:300px;width:900px;font-size:106px;line-height:116px;color:#FFFFFF;font-weight:400}
.g{font-weight:700;background:linear-gradient(90deg,#20B4F5 0%,#00D6DC 50%,#00E6A0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.m{position:absolute;left:90px;top:800px;width:900px;font-size:60px;line-height:80px;font-weight:500;color:#FFFFFF}
</style></head><body>
<div class="slide" data-canvas-width="1080" data-canvas-height="1350">
<p class="t">Seu cliente do <span class="g">Simples</span></p>
<p class="m">Teste Medium 500</p>
</div></body></html>
